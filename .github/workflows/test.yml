name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-clj:
    strategy:
      matrix:
        jdk: [11, 17, 21, 25]

    name: Clojure (Java ${{ matrix.jdk }})

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java ${{ matrix.jdk }}
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: ${{ matrix.jdk }}
    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        # 2.13.x tags on the GitHub mirror have a stale bin/lein (2.12.1-SNAPSHOT)
        lein: 2.12.0
    - name: Run tests
      run: lein test
